<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Position Labeller</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e1a;
            --bg-secondary: #111827;
            --bg-card: #1a2235;
            --border: #2a3650;
            --text-primary: #e8ecf4;
            --text-secondary: #8892a8;
            --accent: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.3);
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ─────────────────────────────────── */
        header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            box-shadow: 0 0 16px var(--accent-glow);
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        h1 span {
            color: var(--text-secondary);
            font-weight: 400;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .room-count {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            background: var(--bg-card);
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .room-count strong {
            color: var(--accent);
        }

        /* ── Buttons ────────────────────────────────── */
        button {
            font-family: 'DM Sans', sans-serif;
            font-size: 0.82rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 7px;
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-primary {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }
        .btn-primary:hover {
            background: #2563eb;
            box-shadow: 0 0 20px var(--accent-glow);
        }

        .btn-secondary {
            background: var(--bg-card);
            color: var(--text-primary);
        }
        .btn-secondary:hover {
            background: var(--border);
        }

        .btn-danger {
            background: transparent;
            color: var(--danger);
            border-color: var(--danger);
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.1);
        }

        .btn-success {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }
        .btn-success:hover {
            background: #059669;
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.3);
        }

        /* ── Main Layout ────────────────────────────── */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* ── Sidebar ────────────────────────────────── */
        .sidebar {
            width: 300px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .sidebar-header h2 {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            display: flex;
            gap: 8px;
        }

        .input-group input {
            flex: 1;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .input-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .input-group input::placeholder {
            color: var(--text-secondary);
        }

        .room-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .room-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 4px;
            cursor: pointer;
            transition: background 0.12s;
            border: 1px solid transparent;
        }

        .room-item:hover {
            background: var(--bg-card);
        }

        .room-item.active {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--accent);
        }

        .room-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .room-info {
            flex: 1;
            min-width: 0;
        }

        .room-name {
            font-weight: 600;
            font-size: 0.85rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .room-coords {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.72rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .room-delete {
            opacity: 0;
            background: none;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 1rem;
            padding: 4px;
            transition: opacity 0.12s;
        }

        .room-item:hover .room-delete {
            opacity: 1;
        }

        .sidebar-footer {
            padding: 12px 16px;
            border-top: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* ── Canvas Area ────────────────────────────── */
        .canvas-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .canvas-toolbar {
            padding: 10px 16px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.82rem;
        }

        .toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .mode-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 600;
        }

        .mode-badge.placing {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            border: 1px solid var(--accent);
        }

        .mode-badge.idle {
            background: rgba(136, 146, 168, 0.1);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }

        .cursor-coords {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .canvas-container {
            flex: 1;
            overflow: auto;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 50% 50%, rgba(59, 130, 246, 0.03) 0%, transparent 70%),
                linear-gradient(rgba(42, 54, 80, 0.3) 1px, transparent 1px),
                linear-gradient(90deg, rgba(42, 54, 80, 0.3) 1px, transparent 1px);
            background-size: 100% 100%, 20px 20px, 20px 20px;
        }

        .upload-prompt {
            text-align: center;
            padding: 40px;
        }

        .upload-prompt .icon {
            font-size: 3rem;
            margin-bottom: 16px;
            opacity: 0.6;
        }

        .upload-prompt p {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 0.9rem;
        }

        .upload-prompt .hint {
            font-size: 0.78rem;
            color: var(--text-secondary);
            opacity: 0.6;
        }

        .floor-plan-wrapper {
            position: relative;
            display: inline-block;
            cursor: crosshair;
        }

        .floor-plan-wrapper img {
            display: block;
            max-width: 100%;
            max-height: calc(100vh - 200px);
            user-select: none;
            -webkit-user-drag: none;
        }

        /* ── Markers on floor plan ──────────────────── */
        .room-marker {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }

        .marker-dot {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2.5px solid white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4), 0 0 0 1px rgba(0,0,0,0.1);
            position: relative;
        }

        .marker-dot::after {
            content: '';
            position: absolute;
            top: -6px;
            left: -6px;
            right: -6px;
            bottom: -6px;
            border-radius: 50%;
            border: 2px solid;
            border-color: inherit;
            opacity: 0.3;
        }

        .marker-label {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 4px;
            white-space: nowrap;
            border: 1px solid var(--border);
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        /* ── Click preview ──────────────────────────── */
        .click-preview {
            position: absolute;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 20;
        }

        .preview-ring {
            width: 30px;
            height: 30px;
            border: 2px dashed var(--accent);
            border-radius: 50%;
            animation: preview-pulse 1.2s ease-in-out infinite;
        }

        @keyframes preview-pulse {
            0%, 100% { opacity: 0.4; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        /* ── Empty state ────────────────────────────── */
        .empty-rooms {
            text-align: center;
            padding: 30px 16px;
            color: var(--text-secondary);
            font-size: 0.82rem;
        }

        .empty-rooms .icon {
            font-size: 1.5rem;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        /* ── Toast notification ─────────────────────── */
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--bg-card);
            border: 1px solid var(--border);
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 0.85rem;
            font-weight: 500;
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* ── Scrollbar ──────────────────────────────── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }
    </style>
</head>
<body>

<header>
    <div class="header-left">
        <div class="logo">📍</div>
        <h1>Room Labeller <span>/ floor plan mapper</span></h1>
    </div>
    <div class="header-right">
        <div class="room-count"><strong id="count">0</strong> rooms mapped</div>
        <button class="btn-secondary" onclick="document.getElementById('file-input').click()">
            🗺️ Upload Floor Plan
        </button>
        <input type="file" id="file-input" accept="image/*" hidden>
    </div>
</header>

<div class="main">
    <!-- Sidebar -->
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>📋 Rooms</h2>
            <div class="input-group">
                <input type="text" id="room-name-input" placeholder="e.g. Room 3.01" />
                <button class="btn-primary" id="add-room-btn" onclick="startPlacing()">+ Add</button>
            </div>
        </div>
        <div class="room-list" id="room-list">
            <div class="empty-rooms">
                <div class="icon">🏠</div>
                <p>No rooms yet.<br>Add a room name and click on the floor plan.</p>
            </div>
        </div>
        <div class="sidebar-footer">
            <button class="btn-success" onclick="exportJSON()" style="width:100%">
                📥 Export room_positions.json
            </button>
            <button class="btn-secondary" onclick="importJSON()" style="width:100%">
                📤 Import existing JSON
            </button>
            <input type="file" id="import-input" accept=".json" hidden>
        </div>
    </div>

    <!-- Canvas -->
    <div class="canvas-area">
        <div class="canvas-toolbar">
            <div class="toolbar-left">
                <span class="mode-badge idle" id="mode-badge">IDLE</span>
                <span id="instruction-text" style="color: var(--text-secondary)">Upload a floor plan to begin</span>
            </div>
            <span class="cursor-coords" id="cursor-coords">x: — y: —</span>
        </div>
        <div class="canvas-container" id="canvas-container">
            <div class="upload-prompt" id="upload-prompt">
                <div class="icon">🗺️</div>
                <p>Upload your floor plan image to get started</p>
                <button class="btn-primary" onclick="document.getElementById('file-input').click()">
                    Choose Image
                </button>
                <p class="hint" style="margin-top:12px">PNG, JPG — any resolution</p>
            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    // ── State ───────────────────────────────────────
    const COLORS = [
        '#3b82f6', '#10b981', '#f59e0b', '#ef4444',
        '#8b5cf6', '#ec4899', '#06b6d4', '#f97316',
        '#14b8a6', '#6366f1', '#84cc16', '#e11d48'
    ];

    let rooms = [];
    let placingMode = false;
    let placingRoomName = '';
    let floorPlanLoaded = false;
    let imageWidth = 0;
    let imageHeight = 0;

    // ── DOM refs ────────────────────────────────────
    const fileInput = document.getElementById('file-input');
    const importInput = document.getElementById('import-input');
    const canvasContainer = document.getElementById('canvas-container');
    const uploadPrompt = document.getElementById('upload-prompt');
    const roomList = document.getElementById('room-list');
    const roomNameInput = document.getElementById('room-name-input');
    const modeBadge = document.getElementById('mode-badge');
    const instructionText = document.getElementById('instruction-text');
    const cursorCoords = document.getElementById('cursor-coords');
    const countEl = document.getElementById('count');

    // ── Floor plan upload ───────────────────────────
    fileInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            uploadPrompt.style.display = 'none';

            // Remove old wrapper if exists
            const old = document.querySelector('.floor-plan-wrapper');
            if (old) old.remove();

            const wrapper = document.createElement('div');
            wrapper.className = 'floor-plan-wrapper';

            const img = document.createElement('img');
            img.src = ev.target.result;
            img.id = 'floor-plan-img';
            img.onload = () => {
                imageWidth = img.naturalWidth;
                imageHeight = img.naturalHeight;
                floorPlanLoaded = true;
                instructionText.textContent = 'Add a room name -> click on the floor plan to place it';
                showToast('✅ Floor plan loaded — ' + imageWidth + '×' + imageHeight + 'px');
                reRenderMarkers();
            };

            wrapper.appendChild(img);
            canvasContainer.appendChild(wrapper);

            // Click to place
            wrapper.addEventListener('click', handleCanvasClick);

            // Mouse move for coordinates
            wrapper.addEventListener('mousemove', (e) => {
                const rect = img.getBoundingClientRect();
                const x = Math.round((e.clientX - rect.left) / rect.width * imageWidth);
                const y = Math.round((e.clientY - rect.top) / rect.height * imageHeight);
                cursorCoords.textContent = `x: ${x}  y: ${y}`;
            });
        };
        reader.readAsDataURL(file);
    });

    // ── Placing mode ────────────────────────────────
    function startPlacing() {
        const name = roomNameInput.value.trim();
        if (!name) {
            showToast('⚠️ Enter a room name first');
            roomNameInput.focus();
            return;
        }
        if (!floorPlanLoaded) {
            showToast('⚠️ Upload a floor plan first');
            return;
        }
        if (rooms.find(r => r.name === name)) {
            showToast('⚠️ Room "' + name + '" already exists');
            return;
        }

        placingMode = true;
        placingRoomName = name;
        modeBadge.textContent = 'PLACING: ' + name;
        modeBadge.className = 'mode-badge placing';
        instructionText.textContent = 'Click on the floor plan to place "' + name + '"';
    }

    function handleCanvasClick(e) {
        if (!placingMode) return;

        const img = document.getElementById('floor-plan-img');
        const rect = img.getBoundingClientRect();
        const x = Math.round((e.clientX - rect.left) / rect.width * imageWidth);
        const y = Math.round((e.clientY - rect.top) / rect.height * imageHeight);

        const color = COLORS[rooms.length % COLORS.length];

        rooms.push({
            name: placingRoomName,
            x: x,
            y: y,
            color: color
        });

        placingMode = false;
        placingRoomName = '';
        roomNameInput.value = '';
        modeBadge.textContent = 'IDLE';
        modeBadge.className = 'mode-badge idle';
        instructionText.textContent = 'Add another room or export your positions';

        updateUI();
        showToast('✅ Placed "' + rooms[rooms.length - 1].name + '" at (' + x + ', ' + y + ')');
    }

    // ── Room name input enter key ───────────────────
    roomNameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') startPlacing();
    });

    // ── UI Updates ──────────────────────────────────
    function updateUI() {
        countEl.textContent = rooms.length;
        renderRoomList();
        reRenderMarkers();
    }

    function renderRoomList() {
        if (rooms.length === 0) {
            roomList.innerHTML = `
                <div class="empty-rooms">
                    <div class="icon">🏠</div>
                    <p>No rooms yet.<br>Add a room name and click on the floor plan.</p>
                </div>
            `;
            return;
        }

        roomList.innerHTML = rooms.map((room, i) => `
            <div class="room-item" onclick="highlightRoom(${i})">
                <div class="room-dot" style="background:${room.color}; box-shadow: 0 0 8px ${room.color}55"></div>
                <div class="room-info">
                    <div class="room-name">${room.name}</div>
                    <div class="room-coords">x: ${room.x}  y: ${room.y}</div>
                </div>
                <button class="room-delete" onclick="event.stopPropagation(); deleteRoom(${i})">✕</button>
            </div>
        `).join('');
    }

    function reRenderMarkers() {
        // Remove old markers
        document.querySelectorAll('.room-marker').forEach(m => m.remove());

        const img = document.getElementById('floor-plan-img');
        if (!img) return;

        const wrapper = img.parentElement;

        rooms.forEach(room => {
            const pxX = (room.x / imageWidth) * 100;
            const pxY = (room.y / imageHeight) * 100;

            const marker = document.createElement('div');
            marker.className = 'room-marker';
            marker.style.left = pxX + '%';
            marker.style.top = pxY + '%';

            marker.innerHTML = `
                <div class="marker-dot" style="background:${room.color}; border-color:${room.color}"></div>
                <div class="marker-label">${room.name}</div>
            `;

            wrapper.appendChild(marker);
        });
    }

    function highlightRoom(index) {
        document.querySelectorAll('.room-item').forEach((el, i) => {
            el.classList.toggle('active', i === index);
        });
    }

    function deleteRoom(index) {
        const name = rooms[index].name;
        rooms.splice(index, 1);
        updateUI();
        showToast('🗑️ Removed "' + name + '"');
    }

    // ── Export ───────────────────────────────────────
    function exportJSON() {
        if (rooms.length === 0) {
            showToast('⚠️ No rooms to export');
            return;
        }

        const output = {};
        rooms.forEach(room => {
            output[room.name] = {
                x: room.x,
                y: room.y
            };
        });

        const data = JSON.stringify(output, null, 2);
        const blob = new Blob([data], { type: 'application/json' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = 'room_positions.json';
        a.click();
        URL.revokeObjectURL(url);

        showToast('📥 Exported ' + rooms.length + ' rooms to room_positions.json');
    }

    // ── Import ──────────────────────────────────────
    function importJSON() {
        importInput.click();
    }

    importInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = (ev) => {
            try {
                const data = JSON.parse(ev.target.result);
                rooms = [];
                let i = 0;
                for (const [name, pos] of Object.entries(data)) {
                    rooms.push({
                        name: name,
                        x: pos.x,
                        y: pos.y,
                        color: COLORS[i % COLORS.length]
                    });
                    i++;
                }
                updateUI();
                showToast('📤 Imported ' + rooms.length + ' rooms');
            } catch (err) {
                showToast('❌ Invalid JSON file');
            }
        };
        reader.readAsText(file);
    });

    // ── Toast ───────────────────────────────────────
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
    }
</script>

</body>
</html>
