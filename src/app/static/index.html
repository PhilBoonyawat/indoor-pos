<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indoor Position Tracker — Bush House</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>

    <header>
        <div class="header-left">
            <div class="logo">📍</div>
            <h1>Indoor Tracker <span>/ Bush House L7</span></h1>
        </div>
        <div class="header-center">
            <span id="mode-badge" class="mode-badge demo">DEMO</span>
            <span id="room-label" class="room-label">Room: —</span>
            <span id="confidence-label" class="confidence-label">—</span>
        </div>
        <div class="header-right">
            <label class="model-selector-label" for="model-select">Model:</label>
            <select id="model-select" class="model-select">
                <option value="">Loading...</option>
            </select>
        </div>
    </header>

    <div id="map"></div>

    <div id="info-panel">
        <div class="info-row">
            <span class="info-key">APs Detected</span>
            <span id="aps-count" class="info-value">—</span>
        </div>
        <div class="info-row">
            <span class="info-key">Model</span>
            <span id="model-name" class="info-value">—</span>
        </div>
        <div class="info-row">
            <span class="info-key">Last Update</span>
            <span id="last-update" class="info-value">—</span>
        </div>
    </div>

    <div id="controls">
        <button id="btn-center" title="Center on position">🎯</button>
        <button id="btn-trail" title="Toggle trail">🔵</button>
        <button id="btn-clear" title="Clear trail">🗑️</button>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>
