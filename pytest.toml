[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore:.*FitFailedWarning.*",
    "ignore:Tight layout not applied.*:UserWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "*/test_*"
]

[tool.coverage.report]
show_missing = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "if __name__",
    "def main",
    "raise NotImplementedError",
]